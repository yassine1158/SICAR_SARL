<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{extra_head}}<title>{{title}}</title>
  <meta name="description" content="{{desc}}">
  <meta name="theme-color" content="#121418">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SICAR SARL">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{desc}}">
  <meta property="og:image" content="assets/img/station-concassage.jpg">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    /* Téléphone : version une page (mobile.html) — ordinateur : version multi-pages */
    (function(){
      var page="{{page}}", mobile=matchMedia("(max-width: 767px), (pointer: coarse) and (max-height: 500px)").matches;
      var sections={accueil:"",entreprise:"#entreprise",produits:"#produits",production:"#production",galerie:"#galerie",faq:"#faq",contact:"#contact"};
      if(page==="404") return;
      if(mobile && page!=="onepage"){
        var isProduct=/produit\.html$/.test(location.pathname);
        location.replace("mobile.html"+(isProduct?location.search:"")+(sections[page]||""));
      } else if(!mobile && page==="onepage"){
        var id=new URLSearchParams(location.search).get("id"), h=location.hash.slice(1);
        var files={entreprise:"entreprise.html",produits:"produits.html",production:"production.html",galerie:"galerie.html",faq:"faq.html",contact:"contact.html"};
        location.replace(id?"produit.html?id="+encodeURIComponent(id):(files[h]||"index.html"));
      }
    })();
    try{if(sessionStorage.getItem("sicar_seen"))document.documentElement.classList.add("seen")}catch(e){}
  </script>
</head>
<body data-page="{{page}}">
